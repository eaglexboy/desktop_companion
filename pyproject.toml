[project]
name = "deskmate-brain"
version = "1.1.2"
description = "Local brain daemon for the deskmate desktop companion agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.8",
    "watchdog>=4.0",
    "httpx>=0.27",
    "jeepney>=0.8",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]
voice = ["piper-tts>=1.8"]
cloud = ["anthropic>=0.40"]

[tool.pytest.ini_options]
testpaths = ["brain/tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
# jeepney ships no type stubs / py.typed marker.
module = "jeepney.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML ships no type stubs here.
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faster-whisper ships no type stubs / py.typed marker.
module = "faster_whisper.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]
