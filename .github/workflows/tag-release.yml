# When a PR is merged to main, tag the commit with the version pyproject.toml declares
# and publish a GitHub Release for that tag, with notes generated from the PRs merged
# since the previous tag. Each step is skipped if its work already exists, so re-running
# is safe and a tag that has no release yet gets one.
name: Tag release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        run: |
          version=$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag if it does not exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # Notes cover everything since the previous version tag (none for the first release).
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -x -A1 "$TAG" | sed -n 2p || true)
          args=(--verify-tag --generate-notes --title "$TAG")
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "${args[@]}"
