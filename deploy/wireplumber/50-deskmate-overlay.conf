# WirePlumber drop-in: give the Deskmate overlay its own saved volume.
#
# Why: Qt Multimedia tags every stream `media.role = "music"` and offers no way
# to change it. WirePlumber (scripts/node/state-stream.lua) saves a stream's
# volume under a key built from its media role, so the overlay shared one
# saved volume with every other "music" app -- moving Spotify's slider moved
# the companion's voice, and the reverse. An application name does not help:
# the role takes priority over it. (pipewire-pulse `pulse.rules`/`stream.rules`
# were tried first and do not change the role; this is the layer that decides.)
#
# This rule rewrites the role, for key-forming purposes only, to a private one
# so the overlay's volume is stored separately ("media.role:companion").
# "companion" is not a role any PipeWire/WirePlumber policy treats specially,
# so there are no ducking or routing side effects, and the stream itself is
# untouched.
#
# Installed by deploy/install.sh into ~/.config/wireplumber/wireplumber.conf.d/ ;
# takes effect after `systemctl --user restart wireplumber`.
stream.rules = [
  {
    matches = [ { node.name = "deskmate-overlay" } ]
    actions = {
      update-props = {
        media.role = "companion"
      }
    }
  }
]
